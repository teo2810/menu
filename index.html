<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<script>
(function(){
  var ok = {rosa:"#F6D4E0",cielo:"#D4E4F6",menta:"#D4F0E4",limone:"#F6F0D4",pesca:"#F6E0D4",corallo:"#F6D4DC"};
  var id = "rosa";
  try { id = localStorage.getItem("menu-tint-v1") || "rosa"; } catch (e) {}
  if (!ok[id]) id = "rosa";
  document.documentElement.setAttribute("data-tint", id);
  document.documentElement.style.backgroundColor = ok[id];
  window.paintStatusBar = function(hex){
    document.querySelectorAll("meta[name=theme-color]").forEach(function(m){ m.parentNode.removeChild(m); });
    function add(media){
      var m = document.createElement("meta");
      m.setAttribute("name", "theme-color");
      m.setAttribute("content", hex);
      if (media) m.setAttribute("media", media);
      document.head.appendChild(m);
    }
    add();
    add("(display-mode: standalone)");
    document.documentElement.style.backgroundColor = hex;
  };
  window.paintStatusBar(ok[id]);
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Menu" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Menu</title>
<meta name="app-build" content="" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root, html[data-tint="rosa"] {
  --bg:#FDFBFD;
  --bg2:#F5F7FC;
  --card:#ffffff;
  --ink:#2E1A47;
  --muted:#7F7199;
  --quiet:#9A8CB2;
  --brand:#7A68B8;
  --brand-soft:#F3EDFB;
  --grad:linear-gradient(135deg,#E2D9FC 0%, #FCD9E6 100%);
  --peach:#F7C4B8;
  --danger:#E25C5C;
  --primo:#E2D9FC;
  --secondo:#FCE3D2;
  --contorno:#D2F2E1;
  --frutta:#FCF2D2;
  --merenda:#D2EAFC;
  --line:#EDE6F6;
  --shadow:0 8px 22px rgba(46,26,71,.10);
  --wash:#F6D4E0;
  --wash-mid:rgba(246,212,224,.4);
  --blob-a:#F8D5E4;
  --blob-b:#E4D7FA;
  --blob-c:#D8F0E4;
  --wash-end:#F4F2FA;
  --wash-tail:#EEF3F8;
  --nav-h:112px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-tint="cielo"] {
  --brand:#5B7DB8;
  --brand-soft:#E7F0FB;
  --grad:linear-gradient(135deg,#D4E4FC 0%, #D9F0FC 100%);
  --line:#E4EEF6;
  --wash:#D4E4F6;
  --wash-mid:rgba(212,228,246,.4);
  --blob-a:#D5E4F8;
  --blob-b:#DCE4FA;
  --blob-c:#D8F0E4;
  --wash-end:#F2F6FA;
  --wash-tail:#EEF3F8;
}
html[data-tint="menta"] {
  --brand:#3E8A6E;
  --brand-soft:#E5F7EE;
  --grad:linear-gradient(135deg,#C8F0DC 0%, #D9FCE8 100%);
  --line:#DCEEE4;
  --wash:#D4F0E4;
  --wash-mid:rgba(212,240,228,.4);
  --blob-a:#D5F8E4;
  --blob-b:#D7FAEE;
  --blob-c:#D8EAF0;
  --wash-end:#F2FAF6;
  --wash-tail:#EEF8F4;
}
html[data-tint="limone"] {
  --brand:#8A7A40;
  --brand-soft:#FBF6E0;
  --grad:linear-gradient(135deg,#FCEFD2 0%, #F8F6D0 100%);
  --line:#EFE8D2;
  --wash:#F6F0D4;
  --wash-mid:rgba(246,240,212,.45);
  --blob-a:#F8F5D5;
  --blob-b:#FAF0D7;
  --blob-c:#E8F0D8;
  --wash-end:#FAF8F2;
  --wash-tail:#F6F4EE;
}
html[data-tint="pesca"] {
  --brand:#C47A5A;
  --brand-soft:#FBECE4;
  --grad:linear-gradient(135deg,#FCE3D2 0%, #FCD9C8 100%);
  --line:#F0E4DC;
  --wash:#F6E0D4;
  --wash-mid:rgba(246,224,212,.4);
  --blob-a:#F8DCD5;
  --blob-b:#FADFD7;
  --blob-c:#F0E8D8;
  --wash-end:#FAF4F2;
  --wash-tail:#F8F0EE;
}
html[data-tint="corallo"] {
  --brand:#C45A72;
  --brand-soft:#FBE8EE;
  --grad:linear-gradient(135deg,#FCD9E0 0%, #FCC4C8 100%);
  --line:#F0DCE2;
  --wash:#F6D4DC;
  --wash-mid:rgba(246,212,220,.4);
  --blob-a:#F8D5DC;
  --blob-b:#FAD7DE;
  --blob-c:#F0D8E4;
  --wash-end:#FAF2F4;
  --wash-tail:#F8EEF0;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html {
  background-color:var(--wash);
}
html,body {
  margin:0; height:100%;
  background-color:var(--wash);
  background-image:
    linear-gradient(180deg,var(--wash) 0px,var(--wash) 48px,var(--wash-mid) 90px,transparent 140px),
    radial-gradient(880px 480px at 8% 12%, var(--blob-a) 0%, transparent 56%),
    radial-gradient(800px 460px at 100% 8%, var(--blob-b) 0%, transparent 54%),
    radial-gradient(700px 420px at 80% 110%, var(--blob-c) 0%, transparent 58%),
    linear-gradient(180deg,var(--wash) 0%, var(--wash-end) 55%, var(--wash-tail) 100%);
  background-attachment:fixed;
}
body {
  font-family:Nunito,system-ui,sans-serif;
  color:var(--ink); overflow:hidden;
}
.app { height:100dvh; display:flex; flex-direction:column; max-width:480px; margin:0 auto; position:relative; overflow:visible; }
header.top {
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  background:transparent; border:0; box-shadow:none;
}
.app.nohead header.top { display:none; }
.app.nohead main { padding-top:calc(8px + env(safe-area-inset-top,0px)); }
.brand-block h1 { font-family:Fraunces,serif; font-size:1.35rem; margin:0; letter-spacing:-.02em; }
.menu-pick {
  appearance:none; -webkit-appearance:none;
  margin:4px 0 0; padding:4px 22px 4px 0; border:0; max-width:230px;
  background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%237a6a8c' d='M1 1l5 5 5-5'/></svg>") no-repeat right center;
  font-family:inherit; font-size:.82rem; font-weight:800; color:var(--ink); cursor:pointer;
  text-align:left; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pick-row {
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#fff; border:0; border-radius:16px; padding:14px 14px; margin:0 0 8px;
  box-shadow:var(--shadow); font-family:inherit; font-weight:800; color:var(--ink); text-align:left;
}
.pick-row { border-radius:20px; }
.pick-row.on { background:var(--brand-soft); }
.pick-dot {
  width:18px; height:18px; border-radius:50%; flex-shrink:0;
  border:2px solid #d5c9ef; background:#fff;
}
.pick-row.on .pick-dot { border-color:var(--brand); background:var(--brand); box-shadow:inset 0 0 0 3px var(--brand-soft); }
.ask-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.pill {
  background:#fff; border:0; border-radius:999px;
  padding:6px 12px; font-size:.72rem; font-weight:800; color:var(--brand);
  box-shadow:0 6px 16px rgba(46,26,71,.12); white-space:nowrap;
}
main { flex:1; overflow:auto; padding:6px 16px calc(var(--nav-h) + var(--safe-b) + 18px); }
.screen { display:none; animation:rise .35s ease; }
.screen.active { display:block; }
@keyframes rise { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
.week-tabs { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; scrollbar-width:none; }
.week-tabs::-webkit-scrollbar { display:none; }
.week-tab, .day-chip, .edit-btn, .btn { border:0; font-family:inherit; font-weight:800; }
.week-tab {
  flex:0 0 auto; background:#fff; color:var(--quiet); font-size:.8rem;
  padding:9px 16px; border-radius:999px;
  box-shadow:0 8px 20px rgba(46,26,71,.16), 0 2px 4px rgba(46,26,71,.08);
}
.week-tab.on { background:var(--grad); color:var(--ink); box-shadow:0 8px 18px rgba(122,90,160,.24); }
.day-rail { display:flex; gap:8px; margin-bottom:14px; }
.day-chip {
  flex:1; background:#fff; border-radius:20px; padding:8px 0 7px;
  box-shadow:0 8px 20px rgba(46,26,71,.16), 0 2px 4px rgba(46,26,71,.08); color:var(--quiet);
}
.day-chip small { display:block; font-size:.62rem; letter-spacing:.04em; }
.day-chip b { font-size:.95rem; }
.day-chip.on { background:var(--grad); color:var(--ink); box-shadow:0 8px 18px rgba(122,90,160,.24); }
.meal-card {
  background:var(--card); border-radius:24px; padding:16px 16px 14px;
  box-shadow:var(--shadow); margin-bottom:12px; border:0;
}
.meal-card h2 {
  margin:0 0 6px; font-family:Fraunces,serif; font-size:1.12rem;
  display:flex; justify-content:space-between; align-items:center;
}
.edit-btn { background:var(--brand-soft); color:var(--brand); font-size:.72rem; padding:6px 12px; border-radius:999px; }
.btn-del { background:var(--danger); color:#fff; }
.btn-del:active { filter:brightness(.96); }
.course {
  display:grid;
  grid-template-columns:48px 1fr;
  grid-template-rows:auto auto;
  gap:4px 12px; padding:10px 0;
  border-top:1px solid var(--line); align-items:start; cursor:pointer;
  position:relative;
}
.course:first-of-type { border-top:0; }
.course .hint { font-size:.62rem; color:var(--muted); font-weight:700; margin-top:3px; }
.ico {
  grid-column:1; grid-row:1;
  width:48px; height:48px; border-radius:14px; display:grid; place-items:center;
  position:relative; z-index:1;
}
.course-body { grid-column:2; grid-row:1; min-width:0; position:relative; z-index:1; }
.course-extra { display:none; grid-column:2; grid-row:2; padding:0; position:relative; z-index:1; }
.course.open::before {
  content:"";
  position:absolute;
  left:-8px; right:-8px; top:2px; bottom:2px;
  background:var(--brand-soft);
  border-radius:24px;
  box-shadow:0 8px 18px rgba(46,26,71,.08);
  pointer-events:none;
}
.course.open { background:transparent; padding:10px 0; }
.course.open .course-extra { display:block; }
.course.open .hint { display:none; }
.course-extra .status { margin:2px 0 0; font-size:.72rem; }
.ico.svg-primo { background:var(--primo); }
.ico.svg-secondo { background:var(--secondo); }
.ico.svg-contorno { background:var(--contorno); }
.ico.svg-frutta { background:var(--frutta); }
.ico.svg-merenda { background:var(--merenda); }
.ico img { width:32px; height:32px; object-fit:contain; display:block; }
.course .label { font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:800; }
.course .dish { font-weight:800; line-height:1.22; font-size:.92rem; }
.tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.tag { font-size:.65rem; font-weight:800; background:var(--brand-soft); color:var(--brand); border-radius:999px; padding:2px 8px; }
.hero-today {
  background:var(--grad);
  color:var(--ink); border-radius:24px; padding:16px 16px; margin-bottom:12px; box-shadow:var(--shadow);
}
.hero-today .kicker { opacity:.8; font-weight:800; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
.hero-today h2 { font-family:Fraunces,serif; margin:4px 0 0; font-size:1.32rem; }
.hero-today p { margin:0; opacity:.9; font-weight:700; }
.note { background:#fff; border-radius:16px; padding:12px 14px; color:var(--muted); font-size:.82rem; font-weight:700; line-height:1.4; margin-top:8px; }
.allergen-list { display:grid; gap:8px; }
.allergen-row { display:flex; gap:10px; align-items:center; background:#fff; border-radius:20px; padding:12px 14px; box-shadow:var(--shadow); }
.allergen-num { width:28px; height:28px; border-radius:10px; background:var(--merenda); color:var(--ink); display:grid; place-items:center; font-weight:800; font-size:.8rem; }
.drop { border:2px dashed #d9cdef; background:#fff; border-radius:24px; padding:22px 16px; text-align:center; box-shadow:var(--shadow); }
.drop h3 { margin:8px 0 4px; font-family:Fraunces,serif; }
.drop p { margin:0 0 14px; color:var(--muted); font-size:.85rem; font-weight:700; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.btn { border-radius:24px; padding:13px 12px; font-size:.9rem; }
.btn-primary { background:var(--grad); color:var(--ink); }
.btn-ghost { background:var(--brand-soft); color:var(--brand); }
.btn.btn-del { background:var(--danger); color:#fff; }
.btn-wide { width:100%; margin-top:8px; }
.preview-wrap img, .preview-wrap canvas { width:100%; border-radius:16px; display:block; margin:12px 0; }
textarea, input:not(.menu-pick), select:not(.menu-pick) {
  width:100%; font-family:inherit; font-weight:700; border:1px solid var(--line);
  border-radius:16px; padding:10px 12px; background:#fff; color:var(--ink); font-size:.9rem;
}
textarea { min-height:140px; resize:vertical; }
#promptBox { min-height:190px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.72rem; color:var(--muted); }
#jsonPaste { min-height:110px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.78rem; }
.field { margin:10px 0; }
.field label { display:block; font-size:.72rem; font-weight:800; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
.progress { height:8px; background:var(--brand-soft); border-radius:99px; overflow:hidden; margin:10px 0; }
.progress > i { display:block; height:100%; width:0; background:var(--grad); transition:width .2s; }
.status { font-size:.8rem; font-weight:800; color:var(--muted); }
nav.tabbar {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(8px + var(--safe-b));
  width:min(440px, calc(100% - 22px));
  height:92px; background:transparent; z-index:30;
  overflow:visible; pointer-events:none;
}
.tab-stage { position:relative; height:92px; overflow:visible; }
nav.tabbar ul {
  list-style:none; margin:0; padding:0;
  position:absolute; left:0; right:0; bottom:0; height:64px;
  display:grid; grid-template-columns:repeat(4,1fr);
  background:#fff;
  border-radius:32px;
  box-shadow:0 16px 36px rgba(70,45,100,.2);
  pointer-events:auto; overflow:visible;
}
nav.tabbar .blob {
  position:absolute; top:0; left:12.5%;
  width:56px; height:56px; margin-left:-28px;
  background:var(--grad);
  border-radius:50%;
  box-shadow:0 10px 22px rgba(122,90,160,.34), 0 4px 10px rgba(46,26,71,.10), inset 0 3px 8px rgba(255,255,255,.55);
  z-index:2; pointer-events:none;
  transition:left .5s cubic-bezier(.3,1.4,.4,1);
}
nav.tabbar .blob.jump { animation:blobSquash .5s cubic-bezier(.3,1.4,.4,1); }
@keyframes blobSquash {
  0% { transform:scale(1); }
  38% { transform:scale(1.12,.88); }
  68% { transform:scale(.94,1.08); }
  100% { transform:scale(1); }
}
nav.tabbar li { display:flex; position:relative; }
nav.tabbar a {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding-bottom:8px; text-decoration:none; color:#9A8CB2; font-size:.66rem; font-weight:800;
  position:relative; z-index:3;
}
nav.tabbar a .dot {
  position:absolute; left:50%; top:10px;
  width:28px; height:28px; margin-left:-14px;
  display:grid; place-items:center;
  transition:top .5s cubic-bezier(.3,1.4,.4,1), width .35s ease, height .35s ease, margin-left .35s ease;
}
nav.tabbar a .dot img {
  width:28px; height:28px; object-fit:contain; display:block;
  filter:grayscale(1) contrast(1.08) brightness(.92);
  opacity:.78;
  transform:scale(1);
  transition:filter .32s ease, opacity .32s ease, transform .5s cubic-bezier(.3,1.4,.4,1), width .35s ease, height .35s ease;
}
nav.tabbar li.on a { color:var(--ink); }
nav.tabbar li.on a .dot {
  top:-28px;
  width:56px; height:56px;
  margin-left:-28px;
  z-index:4;
}
nav.tabbar li.on a .dot img {
  width:36px; height:36px;
  filter:none;
  opacity:1;
}
nav.tabbar li.on.pop a .dot img { animation:iconPop .5s cubic-bezier(.3,1.4,.4,1); }
@keyframes iconPop {
  0%   { transform:scale(.84); }
  38%  { transform:scale(1.16,.9); }
  68%  { transform:scale(.96,1.1); }
  100% { transform:scale(1); }
}
.modal { position:fixed; inset:0; background:rgba(50,30,60,.42); display:none; align-items:flex-end; justify-content:center; z-index:40; }
.modal.open { display:flex; }
.sheet { background:#fff; width:min(480px,100%); border-radius:24px 24px 0 0; padding:16px 16px calc(20px + var(--safe-b)); max-height:88dvh; overflow:auto; }
.grab { width:42px; height:4px; background:#e4d6f0; border-radius:99px; margin:0 auto 12px; }
.toast {
  position:fixed; left:50%; bottom:calc(var(--nav-h) + 10px);
  transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff;
  font-weight:800; padding:10px 14px; border-radius:999px; opacity:0;
  pointer-events:none; transition:.3s; z-index:50; font-size:.82rem; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.empty { text-align:center; padding:28px 12px; }
.tint-card { margin-bottom:14px; }
.tint-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
.tint-head b { font-family:Fraunces,serif; font-size:1.12rem; }
.tint-rail {
  display:flex; align-items:center; gap:8px;
  background:#fff; border-radius:999px; padding:8px 10px;
  box-shadow:inset 0 0 0 1px var(--line);
}
.tint-dot {
  flex:1; height:36px; border:0; padding:0; border-radius:999px; cursor:pointer;
  box-shadow:inset 0 -1px 0 rgba(46,26,71,.06);
  transform:scale(1); transition:transform .28s cubic-bezier(.3,1.4,.4,1), box-shadow .2s ease;
}
.tint-dot.on {
  transform:scale(1.12);
  box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--brand), 0 6px 14px rgba(46,26,71,.16);
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-block">
      <h1>Menu</h1>
      <button type="button" id="menuPick" class="menu-pick" aria-label="Scegli menu">Aggiungi un menu</button>
    </div>
    <div class="pill" id="periodPill">Nessun periodo</div>
  </header>
  <main>
    <section id="screen-oggi" class="screen active">
      <div class="meal-card empty">
        <h2>Nessun menu</h2>
        <p class="status">Il primo menu che importi apparira qui.</p>
        <button class="btn btn-primary btn-wide" id="goImport">Importa il primo menu</button>
      </div>
    </section>
    <section id="screen-settimane" class="screen"></section>
    <section id="screen-importa" class="screen"></section>
    <section id="screen-info" class="screen"></section>
  </main>
  <nav class="tabbar" aria-label="Navigazione">
    <div class="tab-stage" id="tabStage">
      <div class="blob" id="tabBlob"></div>
      <ul id="tabList">
        <li class="on" data-tab="oggi"><a href="#oggi"><span class="dot"><img src="icons/tab-oggi.png" alt=""></span>Oggi</a></li>
        <li data-tab="settimane"><a href="#settimane"><span class="dot"><img src="icons/tab-settimane.png" alt=""></span>Settimane</a></li>
        <li data-tab="importa"><a href="#importa"><span class="dot"><img src="icons/tab-importa.png" alt=""></span>Importa</a></li>
        <li data-tab="info"><a href="#info"><span class="dot"><img src="icons/tab-menu.png" alt=""></span>Menu</a></li>
      </ul>
    </div>
  </nav>
</div>
<div class="modal" id="editModal">
  <div class="sheet">
    <div class="grab"></div>
    <h3 style="margin:0 0 8px;font-family:Fraunces,serif">Correggi il giorno</h3>
    <p class="status" id="editMeta"></p>
    <div class="field"><label>Primo</label><input id="f-primo" /></div>
    <div class="field"><label>Allergeni primo</label><input id="f-primoA" placeholder="es. 1-14" /></div>
    <div class="field"><label>Secondo</label><input id="f-secondo" /></div>
    <div class="field"><label>Allergeni secondo</label><input id="f-secondoA" /></div>
    <div class="field"><label>Contorno</label><input id="f-contorno" /></div>
    <div class="field"><label>Frutta</label><input id="f-frutta" /></div>
    <div class="field"><label>Merenda</label><input id="f-merenda" /></div>
    <div class="field"><label>Allergeni merenda</label><input id="f-merendaA" /></div>
    <button class="btn btn-primary btn-wide" id="saveEdit">Salva correzioni</button>
    <button class="btn btn-ghost btn-wide" id="closeEdit">Annulla</button>
  </div>
</div>
<div class="modal" id="pickModal">
  <div class="sheet">
    <div class="grab"></div>
    <h3 style="margin:0 0 12px;font-family:Fraunces,serif">Scegli menu</h3>
    <div id="pickList"></div>
    <button class="btn btn-ghost btn-wide" id="closePick">Chiudi</button>
  </div>
</div>
<div class="modal" id="askModal">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="askTitle" style="margin:0 0 8px;font-family:Fraunces,serif">Eliminare?</h3>
    <p class="status" id="askText">Il menu verra rimosso da questo telefono.</p>
    <div class="ask-actions">
      <button class="btn btn-ghost" id="askNo">Annulla</button>
      <button class="btn btn-del" id="askOk">Elimina</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var list = document.getElementById("tabList");
  var TAB_THEME = { bg:"var(--grad)", ink:"#2E1A47" };
  function place(){
    var on = list.querySelector("li.on");
    var blob = document.getElementById("tabBlob");
    var stage = document.getElementById("tabStage");
    if (!on || !blob || !stage) return;
    var s = stage.getBoundingClientRect();
    var r = on.getBoundingClientRect();
    blob.style.left = Math.max(28, Math.min(s.width - 28, (r.left + r.width / 2) - s.left)) + "px";
  }
  window.setTab = function(name){
    document.querySelectorAll(".screen").forEach(function(el){ el.classList.toggle("active", el.id === "screen-" + name); });
    Array.prototype.forEach.call(list.children, function(li){
      var sel = li.dataset.tab === name;
      li.classList.toggle("on", sel);
      li.classList.remove("pop");
      if (sel) { void li.offsetWidth; li.classList.add("pop"); }
    });
    var stage = document.getElementById("tabStage");
    var blob = document.getElementById("tabBlob");
    var theme = TAB_THEME;
    if (stage) { stage.style.setProperty("--blob-bg", theme.bg); stage.style.setProperty("--blob-ink", theme.ink); }
    if (blob) blob.style.background = theme.bg;
    if (blob) {
      blob.classList.remove("jump");
      void blob.offsetWidth;
      blob.classList.add("jump");
      setTimeout(function(){ blob.classList.remove("jump"); }, 520);
    }
    var app = document.querySelector(".app");
    if (app) app.classList.toggle("nohead", name === "importa" || name === "info");
    requestAnimationFrame(place);
  };
  list.addEventListener("click", function(e){
    var a = e.target.closest("a");
    if (!a) return;
    e.preventDefault();
    window.setTab(a.parentElement.dataset.tab);
  });
  document.addEventListener("click", function(e){
    if (e.target && e.target.id === "goImport") { e.preventDefault(); window.setTab("importa"); }
  });
  addEventListener("resize", place);
  window.setTab("oggi");
})();
</script>
<script src="app.js"></script>
</body>
</html>
