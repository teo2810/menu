<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#F3EEF8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Menu" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Menu</title>
<meta name="app-build" content="v0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#f3eef8;
  --card:#fffdfb;
  --ink:#3d3554;
  --muted:#8b8296;
  --lilac:#d9c7f2;
  --mint:#b7e2d4;
  --peach:#f6d4c8;
  --butter:#f3e3b4;
  --sky:#c9def6;
  --rose:#f3c6d6;
  --brand:#d9c7f2;
  --brand-2:#6f5f8a;
  --line:#eadff3;
  --bar:#fffbfe;
  --shadow:0 10px 28px rgba(120,90,150,.08);
  --nav-h:112px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; }
body {
  font-family:Nunito,system-ui,sans-serif;
  background:
    radial-gradient(820px 480px at 0% -10%, #f3c6d6 0%, transparent 55%),
    radial-gradient(720px 420px at 110% 0%, #f3e3b4 0%, transparent 50%),
    radial-gradient(640px 380px at 80% 110%, #b7e2d4 0%, transparent 55%),
    radial-gradient(500px 300px at 10% 90%, #c9def6 0%, transparent 50%),
    var(--bg);
  color:var(--ink); overflow:hidden;
}
.app { height:100dvh; display:flex; flex-direction:column; max-width:480px; margin:0 auto; position:relative; overflow:visible; }
header.top {
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.brand-block h1 { font-family:Fraunces,serif; font-size:1.35rem; margin:0; letter-spacing:-.02em; }
.menu-pick {
  appearance:none; -webkit-appearance:none;
  margin:4px 0 0; padding:4px 22px 4px 0; border:0; max-width:230px;
  background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%237a6a8c' d='M1 1l5 5 5-5'/></svg>") no-repeat right center;
  font-family:inherit; font-size:.82rem; font-weight:800; color:var(--ink); cursor:pointer;
}
.pill {
  background:#fff; border:1px solid var(--line); border-radius:999px;
  padding:6px 10px; font-size:.72rem; font-weight:800; color:var(--brand-2);
  box-shadow:var(--shadow); white-space:nowrap;
}
main { flex:1; overflow:auto; padding:6px 16px calc(var(--nav-h) + var(--safe-b) + 18px); }
.screen { display:none; animation:rise .35s ease; }
.screen.active { display:block; }
@keyframes rise { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
.week-tabs { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; scrollbar-width:none; }
.week-tabs::-webkit-scrollbar { display:none; }
.week-tab, .day-chip, .edit-btn, .btn { border:0; font-family:inherit; font-weight:800; }
.week-tab {
  flex:0 0 auto; background:#fff; color:var(--muted); font-size:.8rem;
  padding:9px 14px; border-radius:999px; box-shadow:var(--shadow);
}
.week-tab.on { background:var(--lilac); color:#4a3a68; }
.day-rail { display:flex; gap:8px; margin-bottom:14px; }
.day-chip {
  flex:1; background:#fff; border-radius:16px; padding:8px 0 7px;
  box-shadow:var(--shadow); color:var(--muted);
}
.day-chip small { display:block; font-size:.62rem; letter-spacing:.04em; }
.day-chip b { font-size:.95rem; }
.day-chip.on { background:var(--mint); color:#2f5b50; }
.meal-card {
  background:var(--card); border-radius:22px; padding:14px 16px 12px;
  box-shadow:var(--shadow); margin-bottom:10px; border:1px solid #fff;
}
.meal-card h2 {
  margin:0 0 6px; font-family:Fraunces,serif; font-size:1.12rem;
  display:flex; justify-content:space-between; align-items:center;
}
.edit-btn { background:#eadcf9; color:var(--brand-2); font-size:.72rem; padding:6px 10px; border-radius:999px; }
.course {
  display:grid; grid-template-columns:48px 1fr; gap:10px 12px; padding:10px 0;
  border-top:1px solid var(--line); align-items:start; cursor:pointer;
}
.course:first-of-type { border-top:0; }
.course .hint { font-size:.62rem; color:var(--muted); font-weight:700; margin-top:3px; }
.course-extra { display:none; grid-column:2; padding:0; }
.course.open { background:#faf7fd; border-radius:16px; margin:4px -8px; padding-left:8px; padding-right:8px; }
.course.open .course-extra { display:block; }
.course.open .hint { display:none; }
.ico { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; flex-shrink:0; margin-top:1px; }
.ico.svg-primo { background:#eadcf9; }
.ico.svg-secondo { background:#f8d4c8; }
.ico.svg-contorno { background:#c8ebd8; }
.ico.svg-frutta { background:#f6e6a8; }
.ico.svg-merenda { background:#c5e4f5; }
.ico img { width:36px; height:36px; object-fit:contain; display:block; }
.course .label { font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:800; }
.course .dish { font-weight:800; line-height:1.22; font-size:.92rem; }
.tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.tag { font-size:.65rem; font-weight:800; background:#f3e8fb; color:var(--brand-2); border-radius:999px; padding:2px 7px; }
.hero-today {
  background:linear-gradient(135deg,#e8d7f8 0%, #c9def6 48%, #b7e2d4 100%);
  color:#3d3554; border-radius:22px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);
}
.hero-today .kicker { opacity:.8; font-weight:800; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
.hero-today h2 { font-family:Fraunces,serif; margin:4px 0 0; font-size:1.32rem; }
.hero-today p { margin:0; opacity:.9; font-weight:700; }
.note { background:#fff; border-radius:16px; padding:12px 14px; color:var(--muted); font-size:.82rem; font-weight:700; line-height:1.4; margin-top:8px; }
.allergen-list { display:grid; gap:8px; }
.allergen-row { display:flex; gap:10px; align-items:center; background:#fff; border-radius:14px; padding:10px 12px; box-shadow:var(--shadow); }
.allergen-num { width:28px; height:28px; border-radius:9px; background:var(--sky); color:#3a5878; display:grid; place-items:center; font-weight:800; font-size:.8rem; }
.drop { border:2px dashed #d7c4ee; background:linear-gradient(180deg,#fff,#f7f1fc); border-radius:22px; padding:22px 16px; text-align:center; box-shadow:var(--shadow); }
.drop h3 { margin:8px 0 4px; font-family:Fraunces,serif; }
.drop p { margin:0 0 14px; color:var(--muted); font-size:.85rem; font-weight:700; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.btn { border-radius:14px; padding:12px 10px; font-size:.9rem; }
.btn-primary { background:linear-gradient(135deg,#d9c7f2,#b7e2d4); color:#3d3554; }
.btn-ghost { background:#f3e8fb; color:var(--ink); }
.btn-wide { width:100%; margin-top:8px; }
.preview-wrap img, .preview-wrap canvas { width:100%; border-radius:16px; display:block; margin:12px 0; }
textarea, input:not(.menu-pick), select:not(.menu-pick) {
  width:100%; font-family:inherit; font-weight:700; border:1px solid var(--line);
  border-radius:12px; padding:10px 12px; background:#fff; color:var(--ink); font-size:.9rem;
}
textarea { min-height:140px; resize:vertical; }
#promptBox { min-height:190px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.72rem; color:var(--muted); }
#jsonPaste { min-height:110px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.78rem; }
.field { margin:10px 0; }
.field label { display:block; font-size:.72rem; font-weight:800; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
.progress { height:8px; background:#eadff3; border-radius:99px; overflow:hidden; margin:10px 0; }
.progress > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#d9c7f2,#b7e2d4); transition:width .2s; }
.status { font-size:.8rem; font-weight:800; color:var(--muted); }
nav.tabbar {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(8px + var(--safe-b));
  width:min(440px, calc(100% - 22px));
  height:92px; background:transparent; z-index:30;
  overflow:visible; pointer-events:none;
}
.tab-stage { position:relative; height:92px; overflow:visible; }
nav.tabbar ul {
  list-style:none; margin:0; padding:0;
  position:absolute; left:0; right:0; bottom:0; height:64px;
  display:grid; grid-template-columns:repeat(4,1fr);
  background:var(--bar);
  border-radius:32px;
  box-shadow:0 14px 34px rgba(120,90,150,.14);
  pointer-events:auto; overflow:visible;
}
nav.tabbar .blob {
  position:absolute; top:0; left:12.5%;
  width:56px; height:56px; margin-left:-28px;
  background:var(--blob-bg,#d9c7f2);
  border-radius:50%;
  box-shadow:0 8px 16px -4px rgba(60,40,90,.28), inset 0 4px 8px rgba(255,255,255,.35);
  z-index:2; pointer-events:none;
  transition:left .5s cubic-bezier(.3,1.4,.4,1), background-color .45s ease;
}
nav.tabbar .blob.jump { animation:blobSquash .5s cubic-bezier(.3,1.4,.4,1); }
@keyframes blobSquash {
  0% { transform:scale(1); }
  38% { transform:scale(1.12,.88); }
  68% { transform:scale(.94,1.08); }
  100% { transform:scale(1); }
}
nav.tabbar li { display:flex; position:relative; }
nav.tabbar a {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding-bottom:8px; text-decoration:none; color:#8b8296; font-size:.66rem; font-weight:800;
  position:relative; z-index:3;
}
nav.tabbar a .dot {
  position:absolute; left:50%; top:10px;
  width:28px; height:28px; margin-left:-14px;
  display:grid; place-items:center;
  transition:top .5s cubic-bezier(.3,1.4,.4,1), width .35s ease, height .35s ease, margin-left .35s ease;
}
nav.tabbar a .dot img {
  width:28px; height:28px; object-fit:contain; display:block;
  filter:grayscale(1) contrast(.9) brightness(1.08);
  opacity:.62;
  transform:scale(1);
  transition:filter .32s ease, opacity .32s ease, transform .5s cubic-bezier(.3,1.4,.4,1), width .35s ease, height .35s ease;
}
nav.tabbar li.on a { color:#1f1a2e; }
nav.tabbar li.on a .dot {
  top:-28px;
  width:56px; height:56px;
  margin-left:-28px;
  z-index:4;
}
nav.tabbar li.on a .dot img {
  width:36px; height:36px;
  filter:none;
  opacity:1;
}
nav.tabbar li.on.pop a .dot img { animation:iconPop .5s cubic-bezier(.3,1.4,.4,1); }
@keyframes iconPop {
  0%   { transform:scale(.84); }
  38%  { transform:scale(1.16,.9); }
  68%  { transform:scale(.96,1.1); }
  100% { transform:scale(1); }
}
.modal { position:fixed; inset:0; background:rgba(50,30,60,.42); display:none; align-items:flex-end; justify-content:center; z-index:40; }
.modal.open { display:flex; }
.sheet { background:#fff; width:min(480px,100%); border-radius:24px 24px 0 0; padding:16px 16px calc(20px + var(--safe-b)); max-height:88dvh; overflow:auto; }
.grab { width:42px; height:4px; background:#e4d6f0; border-radius:99px; margin:0 auto 12px; }
.toast {
  position:fixed; left:50%; bottom:calc(var(--nav-h) + 10px);
  transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff;
  font-weight:800; padding:10px 14px; border-radius:999px; opacity:0;
  pointer-events:none; transition:.3s; z-index:50; font-size:.82rem; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.empty { text-align:center; padding:28px 12px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-block">
      <h1>Menu</h1>
      <select id="menuPick" class="menu-pick" aria-label="Scegli menu"></select>
    </div>
    <div class="pill" id="periodPill">Nessun periodo</div>
  </header>
  <main>
    <section id="screen-oggi" class="screen active">
      <div class="meal-card empty">
        <h2>Nessun menu</h2>
        <p class="status">Il primo menu che importi apparira qui.</p>
        <button class="btn btn-primary btn-wide" id="goImport">Importa il primo menu</button>
      </div>
    </section>
    <section id="screen-settimane" class="screen"></section>
    <section id="screen-importa" class="screen"></section>
    <section id="screen-info" class="screen"></section>
  </main>
  <nav class="tabbar" aria-label="Navigazione">
    <div class="tab-stage" id="tabStage">
      <div class="blob" id="tabBlob"></div>
      <ul id="tabList">
        <li class="on" data-tab="oggi"><a href="#oggi"><span class="dot"><img src="icons/tab-oggi.png" alt=""></span>Oggi</a></li>
        <li data-tab="settimane"><a href="#settimane"><span class="dot"><img src="icons/tab-settimane.png" alt=""></span>Settimane</a></li>
        <li data-tab="importa"><a href="#importa"><span class="dot"><img src="icons/tab-importa.png" alt=""></span>Importa</a></li>
        <li data-tab="info"><a href="#info"><span class="dot"><img src="icons/tab-menu.png" alt=""></span>Menu</a></li>
      </ul>
    </div>
  </nav>
</div>
<div class="modal" id="editModal">
  <div class="sheet">
    <div class="grab"></div>
    <h3 style="margin:0 0 8px;font-family:Fraunces,serif">Correggi il giorno</h3>
    <p class="status" id="editMeta"></p>
    <div class="field"><label>Primo</label><input id="f-primo" /></div>
    <div class="field"><label>Allergeni primo</label><input id="f-primoA" placeholder="es. 1-14" /></div>
    <div class="field"><label>Secondo</label><input id="f-secondo" /></div>
    <div class="field"><label>Allergeni secondo</label><input id="f-secondoA" /></div>
    <div class="field"><label>Contorno</label><input id="f-contorno" /></div>
    <div class="field"><label>Frutta</label><input id="f-frutta" /></div>
    <div class="field"><label>Merenda</label><input id="f-merenda" /></div>
    <div class="field"><label>Allergeni merenda</label><input id="f-merendaA" /></div>
    <button class="btn btn-primary btn-wide" id="saveEdit">Salva correzioni</button>
    <button class="btn btn-ghost btn-wide" id="closeEdit">Annulla</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var list = document.getElementById("tabList");
  var TAB_THEME = {
    oggi:      { bg:"#eadcf9", ink:"#4a3a68" },
    settimane: { bg:"#cdeee1", ink:"#1f5245" },
    importa:   { bg:"#fbe0d2", ink:"#7a4326" },
    info:      { bg:"#d3e6fa", ink:"#28466b" }
  };
  function place(){
    var on = list.querySelector("li.on");
    var blob = document.getElementById("tabBlob");
    var stage = document.getElementById("tabStage");
    if (!on || !blob || !stage) return;
    var s = stage.getBoundingClientRect();
    var r = on.getBoundingClientRect();
    blob.style.left = Math.max(28, Math.min(s.width - 28, (r.left + r.width / 2) - s.left)) + "px";
  }
  window.setTab = function(name){
    document.querySelectorAll(".screen").forEach(function(el){ el.classList.toggle("active", el.id === "screen-" + name); });
    Array.prototype.forEach.call(list.children, function(li){
      var sel = li.dataset.tab === name;
      li.classList.toggle("on", sel);
      li.classList.remove("pop");
      if (sel) { void li.offsetWidth; li.classList.add("pop"); }
    });
    var stage = document.getElementById("tabStage");
    var blob = document.getElementById("tabBlob");
    var theme = TAB_THEME[name] || TAB_THEME.oggi;
    if (stage) { stage.style.setProperty("--blob-bg", theme.bg); stage.style.setProperty("--blob-ink", theme.ink); }
    if (blob) {
      blob.classList.remove("jump");
      void blob.offsetWidth;
      blob.classList.add("jump");
      setTimeout(function(){ blob.classList.remove("jump"); }, 520);
    }
    requestAnimationFrame(place);
  };
  list.addEventListener("click", function(e){
    var a = e.target.closest("a");
    if (!a) return;
    e.preventDefault();
    window.setTab(a.parentElement.dataset.tab);
  });
  document.addEventListener("click", function(e){
    if (e.target && e.target.id === "goImport") { e.preventDefault(); window.setTab("importa"); }
  });
  addEventListener("resize", place);
  window.setTab("oggi");
})();
</script>
<script src="app.js?v=0"></script>
</body>
</html>
